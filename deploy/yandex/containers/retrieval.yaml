# Serverless Container: retrieval (энкодер + геоверификация). Нужен volume с индексом.
service_account_id: <SA_ID>

image:
  image_ref: cr.yandex/<REGISTRY_ID>/svoe-retrieval:<TAG>
  environment:
    ENCODER: siglip2
    ENCODER_MODEL: google/siglip2-so400m-patch16-naflex
    ENCODER_DEVICE: cpu
    VECTOR_BACKEND: pgvector
    TOP_K: "30"
    GEO_WEIGHT: "2.5"
    GEO_TOPK: "10"
    INDEX_DIR: /app/data/index
    CATALOG_JSONL: /app/data/catalog/catalog.jsonl
    HF_HOME: /models/hf
    WARMUP_ON_START: "1"
  secrets:
    - id: <LOCKBOX_SECRET_ID>
      version_id: <LOCKBOX_VERSION_ID>
      key: DATABASE_URL
  mounts:
    - mount_point: /app/data
      mode: ro
      object_storage:
        bucket: svoe-vino-data
    - mount_point: /models
      mode: ro
      object_storage:
        bucket: svoe-vino-models

container:
  concurrency: 2
  memory: 4Gb
  cores: 4
  core_fraction: 100
  timeout: 60
  network_id: <NETWORK_ID>
